<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14327d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ALR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Cotizador ALR</title>
<style>
:root{
  --c1:#fb0c0f; --c2:#14327d;
  --bg:#f3f5fa; --card:#fff; --ink:#14213d; --mut:#64708a; --line:#e3e8f0; --soft:#f7f9fd;
  --ok:#168a4a; --warn:#b7791f; --bad:#c53030; --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--c2);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.2)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:42px;width:auto;max-width:160px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.brand b{font-size:15px;letter-spacing:.2px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:transparent;border:0;color:#cfd8ea;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
nav.tabs button:hover{background:rgba(255,255,255,.1);color:#fff}
nav.tabs button.on{background:var(--c1);color:#fff}
.stripe{height:4px;background:linear-gradient(90deg,var(--c1),var(--c1) 40%,#fff 40%,#fff 42%,var(--c2) 42%)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 18%,transparent)}
input.bad{border-color:var(--bad)}
input[type=checkbox],input[type=radio]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--c1);color:#fff;transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec{background:#fff;color:var(--c2);border:1.5px solid var(--line)}
.btn.dark{background:var(--c2)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--c1);padding:6px 10px}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .r{text-align:right} .c{text-align:center} .mono{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f9;color:var(--c2);white-space:nowrap}
.pill.ok{background:#e3f5ea;color:var(--ok)} .pill.warn{background:#fdf1d9;color:var(--warn)} .pill.bad{background:#fde6e6;color:var(--bad)} .pill.red{background:color-mix(in srgb,var(--c1) 12%,#fff);color:var(--c1)} .pill.dark{background:var(--c2);color:#fff}
.note{background:#fff8e6;border:1px solid #f3dca2;color:#7a5a10;padding:10px 12px;border-radius:10px;font-size:13px}
.note.info{background:#eef4ff;border-color:#c9daf8;color:#2a4a85}
.note.bad{background:#fde6e6;border-color:#f3b4b4;color:#8a1f1f}
.note.ok{background:#e8f6ee;border-color:#b9e2c8;color:#146c3b}
.hero{background:linear-gradient(135deg,var(--c2),color-mix(in srgb,var(--c2) 78%,#000));color:#fff;padding:34px 0 70px}
.hero h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.5px}
.hero p{margin:8px 0 0;color:#d6def0;max-width:560px}
.pull{margin-top:-48px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
.stepn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c1);color:#fff;font-weight:800;font-size:13px;margin-right:8px}
.h2{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.piece{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfd}
.piece .head{display:grid;grid-template-columns:1fr 110px 36px;gap:10px;align-items:end}
.piece .dim{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.piece .meta{font-size:12px;color:var(--mut);margin-top:8px}
.x{border:1.5px solid var(--line);background:#fff;border-radius:9px;height:40px;cursor:pointer;color:var(--bad);font-size:18px}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.sum dt{color:var(--mut)} .sum dd{margin:0;text-align:right;font-weight:600}
.sum .tot{border-top:2px dashed var(--line);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.sum .tot b{font-size:30px;color:var(--c2);letter-spacing:-1px}
.eta{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--c2) 7%,#fff);border:1px solid color-mix(in srgb,var(--c2) 18%,#fff);border-radius:12px;padding:12px;margin-top:14px}
.eta b{display:block;color:var(--c2)}
.eta .ico{width:38px;height:38px;border-radius:10px;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.chk input{margin-top:3px}
.chk:has(input:checked){border-color:var(--c1);background:color-mix(in srgb,var(--c1) 6%,#fff)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 22px 38px}
.tl li:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .dot{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.tl li.done .dot{background:var(--ok);border-color:var(--ok)}
.tl li.done:before{background:var(--ok)}
.tl li.cur .dot{background:var(--c1);border-color:var(--c1);box-shadow:0 0 0 5px color-mix(in srgb,var(--c1) 22%,transparent)}
.tl li.todo{color:#9aa5bb}
.tl b{display:block}
.tl .when{font-size:12px;color:var(--mut)}
/* ===== ERP shell ===== */
.erp{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:calc(100vh - 68px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:68px;align-self:start;height:calc(100vh - 68px);overflow:auto}
.side .who{padding:10px 12px;border-radius:12px;background:var(--soft);margin-bottom:12px}
.side .who b{display:block}
.side button.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:#38465f}
.side button.nv:hover{background:var(--soft)}
.side button.nv.on{background:color-mix(in srgb,var(--c1) 10%,#fff);color:var(--c1)}
.side button.nv .n{margin-left:auto;background:var(--c1);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;font-weight:800}
.side .grp{font-size:11px;font-weight:800;letter-spacing:.8px;color:#98a3b8;text-transform:uppercase;padding:14px 12px 4px}
.main{padding:20px;min-width:0}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ptitle h2{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border-left:5px solid var(--c1)}
.kpi.b{border-left-color:var(--c2)} .kpi.g{border-left-color:var(--ok)} .kpi.w{border-left-color:#e0a21b}
.kpi small{color:var(--mut);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.kpi b{display:block;font-size:26px;letter-spacing:-.5px;margin-top:2px}
.kpi span{font-size:12px;color:var(--mut)}
.subtabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.subtabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font-weight:700;cursor:pointer;color:var(--mut)}
.subtabs button.on{background:var(--c2);border-color:var(--c2);color:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
.scroll{overflow-x:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.bars .br{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .tr{height:12px;border-radius:9px;background:#e9edf5;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--c2);border-radius:9px}
.bars .tr i.r{background:var(--c1)}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:#e9edf5}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;padding:20px;animation:in .2s}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:grid;place-items:start center;padding:16px;overflow:auto}
.modal>.card{max-width:520px;width:100%;margin-top:6vh}
.modal.wide>.card{max-width:860px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--c2);color:#fff;padding:12px 20px;border-radius:12px;z-index:90;box-shadow:var(--shadow);font-weight:600;max-width:92vw;text-align:center}
.toast.bad{background:var(--bad)}
.logo-prev{height:60px;max-width:200px;object-fit:contain;background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:6px}
.ok-big{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
/* scanner */
.scanbox{background:#0f1b33;color:#fff;border-radius:var(--r);padding:18px}
.scanbox input{background:#fff;font-size:18px;font-family:ui-monospace,Menlo,monospace}
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.mode button{border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:12px 10px;cursor:pointer;font-weight:700;text-align:left}
.mode button small{display:block;font-weight:500;opacity:.7;font-size:12px}
.mode button.on{background:var(--c1);border-color:var(--c1)}
.feed .it{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;margin-bottom:6px;font-size:14px}
.feed .it.ok{background:#e8f6ee;color:#146c3b}.feed .it.bad{background:#fde6e6;color:#8a1f1f}.feed .it.warn{background:#fff3da;color:#7a5a10}
.feed .it b{font-family:ui-monospace,Menlo,monospace;font-size:13px}
video.cam{width:100%;border-radius:12px;background:#000;max-height:300px;object-fit:cover}
.boxes{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.boxes i{width:14px;height:14px;border-radius:3px;background:#dfe5f0;display:block}
.boxes i.s1{background:#9bb4e6}.boxes i.s2{background:#4f78d4}.boxes i.s3{background:#e0a21b}.boxes i.s4{background:#b06ad8}.boxes i.s5{background:var(--ok)}
/* docs */
.doc{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:13px;padding:6px}
.doc h1{font-size:20px}
.doc table{font-size:12px}
.doc th{color:#000;background:#eee;border:1px solid #999;text-transform:none;letter-spacing:0;font-size:12px}
.doc td{border:1px solid #bbb;padding:5px 7px}
.doc .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--c1);padding-bottom:10px;margin-bottom:10px;gap:12px}
.doc .hd img.lg{height:48px}
.doc .sig{display:flex;gap:36px;margin-top:46px;font-size:12px}
.doc .sig div{flex:1;border-top:1px solid #000;padding-top:4px}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0}
.doc .qr{width:96px;height:96px;flex:none}
.doc .qr svg{width:100%;height:100%;display:block}
.doc .wm{font-size:11px;color:#a00;border:1px dashed #a00;padding:4px 8px;display:inline-block;margin:6px 0}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lab{background:#fff;border:2px solid #111;border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;break-inside:avoid;color:#000}
.lab .qr{width:104px;height:104px;flex:none}.lab .qr svg{width:100%;height:100%;display:block}
.lab .t b{font-size:15px;display:block}.lab .t .big{font-size:26px;font-weight:900;line-height:1}
.lab .t div{font-size:12px}
footer{padding:26px 16px;text-align:center;color:var(--mut);font-size:12px}
.sheet{max-height:60vh;overflow:auto}
.pr-only{display:none}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}.sticky{position:static}
  nav.tabs button{padding:8px 9px;font-size:13px}.brand b{display:none}
  .erp{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .who,.side .grp{display:none}
  .side button.nv{width:auto;white-space:nowrap;flex:none}
  .main{padding:14px 12px}
  .row3,.row4{grid-template-columns:1fr 1fr}
  .bars .br{grid-template-columns:100px 1fr 50px}
}
@media(max-width:600px){.row2,.row3,.row4{grid-template-columns:1fr}.piece .dim{grid-template-columns:1fr 1fr}.piece .head{grid-template-columns:1fr 90px 36px}}
@media print{
  body{background:#fff}
  header.top,.stripe,.noprint,footer,.toast,.side,.subtabs,.ptitle,.kpis{display:none!important}
  .erp{display:block}.main{padding:0}
  .drawer-bg,.modal{position:static!important;background:none!important;display:block!important;padding:0!important;overflow:visible!important}
  .drawer{width:100%!important;height:auto!important;padding:0!important;animation:none!important;overflow:visible!important}
  .modal>.card{max-width:none!important;box-shadow:none!important;margin:0!important;padding:0!important}
  .card{box-shadow:none}
  .labels{grid-template-columns:repeat(3,1fr)}
  body.printing>*:not(#print-root){display:none!important}
}
#print-root{display:none}
@media print{body.printing #print-root{display:block}}
.grid>.card{margin-top:0}
.scanbox select{background:#fff;color:#14213d}
.scanbox label{color:#cfd8ea}
@media(max-width:600px){ .brand .pill{display:none} header.top .wrap{gap:8px} nav.tabs{gap:2px} nav.tabs button{padding:8px 7px;font-size:12.5px} .brand img{height:36px} }
.mini{display:flex;gap:4px;margin:12px 0 4px}.mini span{flex:1;height:8px;border-radius:6px;background:#e3e8f0}.mini span.d{background:var(--ok)}.mini span.c{background:var(--c1)}

/* ===== v7 ===== */
html{-webkit-text-size-adjust:100%} *{-webkit-tap-highlight-color:transparent} button,select,input{touch-action:manipulation}
.occ{margin:8px 0}.occ-h{display:flex;justify-content:space-between;font-size:13px}.occ-t{height:12px;border-radius:9px;background:#e9edf5;overflow:hidden;margin:4px 0}
.occ-t i{display:block;height:100%;background:var(--c2);border-radius:9px}.occ-t i.hi{background:#e0a21b}.occ-t i.over{background:var(--bad)}
.opscan{margin-bottom:12px}
.opchips{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding-bottom:4px}
.opchips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:10px 16px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.opchips button b{background:var(--soft);border-radius:99px;padding:0 8px;min-width:24px;text-align:center}
.opchips button.on{background:var(--c2);color:#fff;border-color:var(--c2)}.opchips button.on b{background:rgba(255,255,255,.2)}
.oplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.opc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.opc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opc-b{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn.big{flex:1;min-height:52px;font-size:17px}
.pstep{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;margin-bottom:8px;border:1.5px solid var(--line);background:#fff;text-align:left}
.pstep .pn{width:30px;height:30px;border-radius:50%;background:#e3e8f0;color:#64708a;display:grid;place-items:center;font-weight:800;flex:none}
.pstep.ok{background:#f1faf5;border-color:#b9e2c8}.pstep.ok .pn{background:var(--ok);color:#fff}
.pstep.now{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 15%,transparent)}.pstep.now .pn{background:var(--c1);color:#fff}
.sgpad{width:100%;height:auto;aspect-ratio:700/260;border:2px dashed #9aa5bb;border-radius:12px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.qbar{display:none}
details summary{padding:6px 0}
@media(max-width:900px){
  input,select,textarea{font-size:16px}
  .btn{min-height:44px}
  .erp{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:35;display:flex;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-bottom:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .side button.nv{flex-direction:column;gap:2px;font-size:11px;min-width:76px;padding:6px 8px;text-align:center;white-space:nowrap;flex:none;align-items:center;position:relative}
  .side button.nv>span:first-child{font-size:20px;line-height:1}
  .side button.nv .n{position:absolute;top:0;right:10px;margin:0}
  .main{padding:14px 12px 100px}
  .drawer{width:100%;padding:14px 12px}
  .modal>.card{margin-top:2vh;padding:16px}
  .opc-b .btn.big{flex-basis:100%}
  .qbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.1)}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

/* ==================== Cálculo de tarifa ==================== */
function pieceCalc(it, destId){
  const m3u = it.l*it.a*it.h/1e6;
  const m3 = m3u*it.qty, kg = it.kg*it.qty, kgVol = m3*CFG.volFactor;
  let unit=0, line=0, est=false;
  if(it.custom){
    est = true;
    const d = CFG.destinos.find(x=>x.id===destId);
    line = Math.max(kg, kgVol)*(d?d.kgRate:0); unit = it.qty ? line/it.qty : 0;
  } else {
    const c = CFG.cajas.find(x=>x.id===it.cajaId);
    unit = c ? (c.prices[destId]||0) : 0; line = unit*it.qty;
  }
  return {m3, kg, kgVol, unit, line, est};
}
function discPct(piezas){
  const d = CFG.desc; if(!d || !d.on) return 0;
  let p = 0; d.tiers.forEach(t=>{ if(piezas>=t.desde) p=Math.max(p,t.pct); }); return p;
}
function calc(destId, items, seg){
  let m3=0,kg=0,kgVol=0,kgCob=0,sub=0,piezas=0,est=false;
  const lines = items.map(it=>{
    const p = pieceCalc(it,destId);
    m3+=p.m3; kg+=p.kg; kgVol+=p.kgVol; kgCob+=it.custom?Math.max(p.kg,p.kgVol):p.kg; sub+=p.line; piezas+=it.qty; est=est||p.est;
    return {...it, ...p, kgU:it.kg};
  });
  const pct = discPct(piezas), disc = sub*pct/100, net = sub-disc;
  const minApplied = net>0 && net<CFG.minimo;
  const flete = net>0 ? Math.max(net, CFG.minimo) : 0;
  const seguroValor = seg && seg.on ? (+seg.valor||0) : 0;
  const seguro = flete>0 && seguroValor>0 ? seguroValor*CFG.seguroPct/100 : 0;
  const subtotal = flete + seguro;
  const iva = (flete + (CFG.seguroIva?seguro:0))*CFG.iva/100;
  return {lines, piezas, m3, kg, kgVol, kgCob, sub, discPct:pct, disc, flete, seguro, seguroValor:seguro?seguroValor:0, subtotal, minApplied, iva, total:subtotal+iva, est};
}

/* ==================== Entrega estimada ==================== */
function addBiz(d, n){ const x=new Date(d); let k=0; while(k<n){ x.setDate(x.getDate()+1); const w=x.getDay(); if(w!==0&&w!==6) k++; } return x; }
function eta(destId, from){
  const d = dest(destId);
  if(d.tMin==null) return null;
  const salida = addBiz(from||Date.now(), 1);
  return {salida, min:addBiz(salida,d.tMin), max:addBiz(salida,d.tMax), txt:`${d.tMin===d.tMax?d.tMin:d.tMin+"–"+d.tMax} días hábiles`};
}
function etaText(e){ if(!e) return null; return e.min.toDateString()===e.max.toDateString() ? fshort(e.min) : `${fshort(e.min)} – ${fshort(e.max)}`; }

/* ==================== QR ==================== */
function qrSVG(text){
  const q = qrcode(0, "M"); q.addData(String(text)); q.make();
  const n = q.getModuleCount(); let d="";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+4},${r+4}h1v1h-1z`;
  const s = n+8;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
const qrBase = () => ((CFG.qrBase||"").trim() || location.href.split("#")[0]);
/* El QR es una dirección: con la cámara normal del teléfono abre el sistema y la caja se registra sola. */
const boxCode = (folio,n,total) => `${qrBase()}#s.${folio}.${n}.${total}`;
function parseBox(code){
  const s = String(code||"").trim();
  const m = s.match(/^ALR\|([A-Za-z0-9-]+)\|(\d+)\|(\d+)$/) || s.match(/#s\.([A-Za-z0-9-]+)\.(\d+)\.(\d+)\s*$/);
  return m ? {folio:m[1], n:+m[2], total:+m[3]} : null;
}

/* ==================== ZIP (sin compresión) y descargas ==================== */
const _crcT = (()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=_crcT[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc = new TextEncoder(), parts=[], cent=[]; let off=0;
  files.forEach(f=>{
    const data=enc.encode(f.text), name=enc.encode(f.name), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    cent.push(ch.buffer,name);
    off += 30+name.length+data.length;
  });
  const csz = cent.reduce((s,b)=>s+(b.byteLength!==undefined?b.byteLength:b.length),0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csz,true); end.setUint32(16,off,true);
  return new Blob([...parts,...cent,end.buffer],{type:"application/zip"});
}
function download(name, content, type="application/octet-stream"){
  if(SANDBOX){
    const txt = content instanceof Blob ? "(Este archivo solo se puede descargar abriendo el sistema en su propia página web.)" : String(content);
    openModal({title:name, wide:true, html:`<div class="note info sm" style="margin-bottom:10px">En esta vista previa no se permiten descargas. Copia el contenido o abre el sistema en su dirección web para descargar el archivo.</div><textarea id="dl-txt" rows="14" readonly style="font:12px/1.4 ui-monospace,Menlo,monospace">${esc(txt)}</textarea>`,
      actions:`<button class="btn sm" data-act="copyfield" data-arg="dl-txt">Copiar</button>`});
    return;
  }
  const blob = content instanceof Blob ? content : new Blob([content],{type});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function copy(text){
  const fb=()=>{ const a=document.createElement("textarea"); a.value=text; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); toast("Copiado") }catch(e){ toast("No se pudo copiar","bad") } a.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast("Copiado"),fb); else fb();
}
function toast(msg, kind=""){ const t=document.createElement("div"); t.className="toast "+kind; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
let _askKey=null, _askT=0;
function ask(msg){ if(_askKey===msg && Date.now()-_askT<5000){ _askKey=null; return true; } _askKey=msg; _askT=Date.now(); toast(msg+" — da clic otra vez para confirmar"); return false; }
function beep(ok){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; const c=new A(), o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value=ok?880:220; g.gain.value=.08; o.start(); o.stop(c.currentTime+(ok?.09:.28)); setTimeout(()=>c.close(),400); }catch(e){} }

/* ---- cajas escaneadas: cadena de dígitos, un dígito por caja (0 = sin escanear … 5 = entregada) ---- */
const boxStage = (o,n) => +o.sc.charAt(n-1);
function setBox(o,n,s){ o.sc = o.sc.slice(0,n-1)+s+o.sc.slice(n); }
function stageCounts(o){ const c=[0,0,0,0,0,0]; for(let i=0;i<o.sc.length;i++) c[+o.sc[i]]++; return c; }
function atLeast(o,i){ const c=stageCounts(o); let k=0; for(let s=i;s<=5;s++) k+=c[s]; return k; }
const totalBoxes = o => o.totals.piezas;

function advance(o, key, note, by){
  o.status = key; o.history.push({k:key, at:Date.now(), note:note||"", by:by||(ROLE?ROLES[ROLE].t:"Sistema")});
}
function bump(o, key, note, by){ if(stKey(key) > stIdx(o)) advance(o,key,note,by); }
function syncStatus(o){
  if(o.cancelado) return;
  const n = o.sc.length; if(!n) return;
  const min = Math.min(...stageCounts(o).map((v,i)=>v?i:9));
  if(min>=5){ bump(o,"entregado","Todas las cajas entregadas (escaneo)"); if(!o.pod) o.pod={nombre:"Recibido (confirmado por escaneo)", id:"", at:Date.now(), notas:""}; }
  else if(min>=4) bump(o,"almacen_destino","Todas las cajas llegaron a plaza (escaneo)");
  else if(min>=3) bump(o,"transito","Todas las cajas salieron en ruta (escaneo)");
  else if(min>=1) bump(o,"almacen_origen","Todas las cajas recibidas en almacén (escaneo)");
}

function findOrCreateCliente(sol){
  const mail=(sol.correo||"").toLowerCase().trim();
  let c = DB.cli.find(x=>x.correo.toLowerCase()===mail) || DB.cli.find(x=>sol.empresa && x.razon.toLowerCase().startsWith(sol.empresa.toLowerCase()));
  if(c) return c;
  c = {id:"C"+pad(nextSeq("cli",1),3), razon:sol.empresa||sol.nombre, nombre:sol.nombre, rfc:"", regimen:"601", cp:"", uso:"G03", correo:sol.correo, tel:sol.tel, dir:"", credito:0, retIva:false, notas:"Alta automática desde cotizador. Completar datos fiscales.", createdAt:Date.now(), pendiente:true};
  DB.cli.push(c); logEv("Clientes","Alta automática",c.razon); return c;
}

/* ---- pedidos ---- */
function createOrder(q){
  const items = q.items.map(i=>{ const w=withDims(i); return {...w, qty:Math.max(1,parseInt(i.qty,10)||1)}; });
  const cl = findOrCreateCliente(q.sol);
  const o = { folio:`ALR-${new Date().getFullYear()}-${pad(nextSeq("ord",1))}`, createdAt:Date.now(), dest:q.dest, items, sol:{...q.sol}, dst:{...q.dst}, serv:{...q.serv}, obs:q.obs.trim(),
    guia:"", cancelado:false, status:"solicitado", cli:cl.id, rem:null, fac:[], pod:null, inc:[], firmas:{}, notif:{...(q.notif||{})}, practice:false, pr:{}, history:[{k:"solicitado",at:Date.now(),note:"Pedido capturado en línea",by:"Cliente"}] };
  o.seguro = q.serv.seguro ? {on:true, valor:+q.seguro.valor||0, file:q.seguro.file||null} : {on:false,valor:0};
  o.rec = q.serv.recoleccion ? {on:true, dir:q.rec.dir.trim(), contacto:{nombre:q.rec.contacto.nombre.trim(),tel:q.rec.contacto.tel.trim()}, pregunta:q.rec.pregunta.trim(), instr:q.rec.instr.trim(), fecha:q.rec.fecha, desde:q.rec.desde, hasta:q.rec.hasta, estado:"solicitada", solicitadaAt:Date.now()} : {on:false};
  o.totals = calc(o.dest, items, o.seguro); o.sc = "0".repeat(o.totals.piezas);
  DB.ord.unshift(o); logEv("Pedidos","Pedido nuevo",`${o.folio} · ${o.totals.piezas} cajas · ${money(o.totals.total)}`); saveDB();
  const mis=store.get("alr_mis_v1")||[]; mis.unshift(o.folio); store.set("alr_mis_v1",mis.slice(0,20));
  return o;
}
function confirmOrder(o){
  if(!o.guia) o.guia = "ALR-G-"+nextSeq("guia",48200);
  if(!o.rem){ const r={folio:"REM-"+pad(nextSeq("rem",1)), fecha:Date.now(), orden:o.folio}; DB.rem.push(r); o.rem=r.folio; }
  bump(o,"confirmado",`Guía ${o.guia} y remisión ${o.rem} generadas`);
  logEv("Pedidos","Pedido confirmado",`${o.folio} · guía ${o.guia}`); saveDB();
}

/* ---- escaneo ---- */
function doScan(code, mode, ctx){
  const p = parseBox(code);
  if(!p) return {ok:false, kind:"bad", msg:"Código no reconocido", code};
  const o = ordOf(p.folio);
  if(!o) return {ok:false, kind:"bad", msg:`Pedido ${p.folio} no existe`, code};
  if(o.cancelado) return {ok:false, kind:"bad", msg:`${o.folio} está cancelado`, code};
  if(p.n<1 || p.n>o.sc.length || p.total!==o.sc.length) return {ok:false, kind:"bad", msg:`Caja fuera de rango (${p.n}/${p.total})`, code};
  if(stIdx(o) < 1) return {ok:false, kind:"bad", msg:`${o.folio} aún no está confirmado por ALR`, code};
  const cur0 = boxStage(o,p.n);
  if(mode==="auto"){
    if(cur0>=5) return {ok:false, kind:"warn", msg:`Caja ${p.n}/${p.total} de ${o.folio} ya fue entregada`, code, o, n:p.n};
    if(cur0===2) return {ok:false, kind:"warn", msg:`Caja ${p.n}/${p.total} de ${o.folio} ya está cargada${o.viaje?` en ${o.viaje}`:""}; falta registrar la salida de la unidad`, code, o, n:p.n};
    mode = ["recibida","cargada","","llegada","entregada"][cur0];
    if(mode==="cargada"){
      let vv = ctx && ctx.via ? viaOf(ctx.via) : null;
      if(!vv || vv.dest!==o.dest || !["abierto","cargando"].includes(vv.status)) vv = (o.viaje&&viaOf(o.viaje)&&["abierto","cargando"].includes(viaOf(o.viaje).status)?viaOf(o.viaje):null) || DB.via.find(x=>x.dest===o.dest&&["abierto","cargando"].includes(x.status));
      if(!vv) return {ok:false, kind:"bad", msg:`No hay un viaje abierto a ${dest(o.dest).name}. Crea uno en Viajes.`, code, o, n:p.n};
      ctx = {...(ctx||{}), via:vv.id};
    }
  }
  const st = STAGES.find(s=>s.k===mode), cur = cur0;
  if(cur>=st.i) return {ok:false, kind:"warn", msg:`Caja ${p.n}/${p.total} de ${o.folio} ya estaba registrada (${STAGES[cur-1].t})`, code, o, n:p.n};
  if(cur < st.i-1) return {ok:false, kind:"bad", msg:`Caja ${p.n}/${p.total}: falta el paso "${STAGES[st.i-2]?STAGES[st.i-2].t:"previo"}"`, code, o, n:p.n};
  if(mode==="cargada"){
    const v = ctx && ctx.via ? viaOf(ctx.via) : null;
    if(!v) return {ok:false, kind:"bad", msg:"Elige primero la unidad/viaje", code};
    if(v.dest!==o.dest) return {ok:false, kind:"bad", msg:`Destino distinto: la caja va a ${dest(o.dest).name} y la unidad a ${dest(v.dest).name}`, code, o, n:p.n};
    if(v.status==="en_ruta"||v.status==="llegado"||v.status==="cerrado") return {ok:false, kind:"bad", msg:`El viaje ${v.id} ya salió`, code};
    if(!v.ords.includes(o.folio)) v.ords.push(o.folio);
    if(v.status==="abierto") v.status="cargando";
    o.viaje = v.id;
  }
  setBox(o,p.n,st.i);
  syncStatus(o);
  logEv("Escáner",st.t,`${o.folio} caja ${p.n}/${p.total}`); saveDB();
  const itx=itemOfBox(o,p.n);
  return {ok:true, kind:"ok", msg:`${st.t}: caja ${p.n}/${p.total} de ${o.folio}`, code, o, n:p.n, stage:st, dim:`Debe medir ${itx.l}×${itx.a}×${itx.h} cm · ${num(itx.kg,1)} kg`};
}
function viajeFaltantes(v){ let f=0; v.ords.forEach(fo=>{ const o=ordOf(fo); if(o) for(let i=0;i<o.sc.length;i++) if(+o.sc[i]<2) f++; }); return f; }
function viajeCargadas(v){ let f=0; v.ords.forEach(fo=>{ const o=ordOf(fo); if(o) for(let i=0;i<o.sc.length;i++) if(+o.sc[i]===2) f++; }); return f; }
function viajeSalida(v){
  let mov=0; v.ords.forEach(fo=>{ const o=ordOf(fo); if(!o) return; for(let i=0;i<o.sc.length;i++) if(+o.sc[i]===2){ setBox(o,i+1,3); mov++; } syncStatus(o);
    if(atLeast(o,3)>0) bump(o,"transito",`Salió en ${v.unidad} (${v.id}) · ${atLeast(o,3)}/${o.sc.length} cajas`); });
  v.status="en_ruta"; v.salidaAt=Date.now(); logEv("Viajes","Salida",`${v.id} · ${v.unidad} · ${mov} cajas`); saveDB(); return mov;
}
function viajeLlegada(v){
  let mov=0; v.ords.forEach(fo=>{ const o=ordOf(fo); if(!o) return; for(let i=0;i<o.sc.length;i++) if(+o.sc[i]===3){ setBox(o,i+1,4); mov++; } syncStatus(o);
    if(atLeast(o,4)>0) bump(o,"almacen_destino",`Llegó a ${dest(v.dest).name} (${v.id})`); });
  v.status="llegado"; v.llegadaAt=Date.now(); logEv("Viajes","Llegada",`${v.id} · ${mov} cajas`); saveDB(); return mov;
}
function registrarEntrega(o, nombre, idDoc, notas){

/* ---- facturación ---- */
const facSaldo = f => Math.max(0, f.total - f.pagos.reduce((s,p)=>s+p.monto,0));
function facEstado(f){
  if(f.estado==="cancelada") return "cancelada";
  if(f.estado==="borrador") return "borrador";
  if(facSaldo(f)<0.005) return "pagada";
  return Date.now()>f.venc+DAY ? "vencida" : "emitida";
}
function crearFactura(folios){
  const ords = folios.map(ordOf).filter(Boolean); if(!ords.length) return null;
  const cl = cliOf(ords[0].cli);
  const subtotal = ords.reduce((s,o)=>s+o.totals.subtotal,0), iva = ords.reduce((s,o)=>s+o.totals.iva,0);
  const ret = cl.retIva ? subtotal*0.04 : 0;
  const n = nextSeq("fac",1001);
  const f = {id:`${CFG.empresa.serie}-${n}`, serie:CFG.empresa.serie, folio:n, fecha:Date.now(), cli:cl.id, ords:folios.slice(),
    conceptos: ords.flatMap(o=>{ const c=[{desc:`Servicio de transporte de carga ${CFG.origen} → ${dest(o.dest).name} · guía ${o.guia||"s/g"} · pedido ${o.folio} · ${o.totals.piezas} cajas, ${num(o.totals.kg)} kg, ${num(o.totals.m3,3)} m³`, importe:o.totals.flete}];
      if(o.totals.seguro>0) c.push({desc:`Seguro de mercancía ${CFG.seguroPct}% sobre valor declarado ${money(o.totals.seguroValor)} · pedido ${o.folio}`, importe:o.totals.seguro, seguro:true, clave:CFG.seguroClave});
      return c; }),
    subtotal, iva, ret, total:subtotal+iva-ret, estado:"borrador", pagos:[], venc:Date.now()+(cl.credito||0)*DAY,
    metodo: cl.credito>0?"PPD":"PUE", forma: cl.credito>0?"99":"03", uso:cl.uso||"G03", uuid:null};
  ords.forEach(o=>o.fac.push(f.id)); DB.fac.unshift(f); logEv("Facturación","Factura creada (borrador)",`${f.id} · ${cl.razon} · ${money(f.total)}`); saveDB(); return f;
}
function emitirFactura(f){

function qvalid(){

  if(!Q.dst.dir.trim()) m.push("dirección de entrega");
  if(Q.dst.tel.replace(/\D/g,"").length<8) m.push("teléfono del destinatario");
  if(Q.items.some(i=>!(i.qty>=1))) m.push("cantidad de cajas");

  if(Q.items.some(i=>i.custom&&!(i.l>0&&i.a>0&&i.h>0&&i.kg>0))) m.push("medidas de la pieza especial");

}

function modDash(){
  const act = DB.ord.filter(o=>!o.cancelado);
  const porConf = act.filter(o=>o.status==="solicitado");
  const enOp = act.filter(o=>stIdx(o)>=1&&o.status!=="entregado");
  const cajasRuta = act.reduce((s,o)=>s+stageCounts(o)[3],0);
  const entreg = act.filter(o=>o.status==="entregado").length;
  const emit = DB.fac.filter(f=>["emitida","vencida"].includes(facEstado(f)));
  const porCobrar = emit.reduce((s,f)=>s+facSaldo(f),0);
  const vencido = DB.fac.filter(f=>facEstado(f)==="vencida").reduce((s,f)=>s+facSaldo(f),0);
  const alerts=[];
  porConf.forEach(o=>alerts.push({k:"warn",t:`${o.folio} sin confirmar desde ${fdate(o.createdAt)}`,s:`${o.sol.empresa||o.sol.nombre} · ${money(o.totals.total)}`,a:"open",arg:o.folio}));
  act.filter(atrasado).forEach(o=>alerts.push({k:"bad",t:`${o.folio} con retraso`,s:`Debió llegar ${etaText(eta(o.dest,o.createdAt))} · ${stLabel(o.status)}`,a:"open",arg:o.folio}));
  DB.fac.filter(f=>facEstado(f)==="vencida").forEach(f=>alerts.push({k:"bad",t:`Factura ${f.id} vencida`,s:`${cliOf(f.cli).razon} · saldo ${money(facSaldo(f))}`,a:"modgo",arg:"fact"}));
  DB.via.filter(v=>v.status==="cargando").forEach(v=>alerts.push({k:"warn",t:`${v.id} cargando (${v.unidad})`,s:`Faltan ${viajeFaltantes(v)} cajas por subir · destino ${dest(v.dest).name}`,a:"modgo",arg:"viajes"}));
  act.filter(o=>(o.inc||[]).some(x=>x.tipo==="medidas")).forEach(o=>alerts.push({k:"bad",t:`${o.folio} con medidas fuera de lo declarado`,s:"Revisar ajuste de tarifa",a:"open",arg:o.folio}));
  { const rp=DB.ord.filter(o=>!o.cancelado&&recVigente(o)&&o.rec.estado==="solicitada"); if(rp.length) alerts.push({k:"warn",t:`${rp.length} recolección(es) por confirmar`,s:`La más próxima: ${fshort(fromYmd(rp.map(o=>o.rec.fecha).sort()[0]))}`,a:"modgo",arg:"reco"}); }

function refreshScan(){ const a=$("#scan-feed"); if(a) a.innerHTML=scanFeedHTML(); const b=$("#scan-recon"); if(b) b.innerHTML=scanReconHTML(); }
function submitScan(code){
  const g=String(code).match(/#g\.([A-Za-z0-9-]+)\s*$/); if(g){ beep(true); guiaPendiente(g[1]); return; }
  const res = doScan(code, S.scan.mode, {via:S.scan.via});
  S.scan.feed.unshift({...res, at:Date.now()}); if(S.scan.feed.length>40) S.scan.feed.pop();
  if(res.o && res.kind!=="bad" && !S.scan.ord) S.scan.ord=res.o.folio;
  if(res.o && res.ok) S.scan.ord=res.o.folio;
  S.scanResult=null; const rc=$("#scan-result"); if(rc) rc.remove();
  beep(res.ok); refreshScan();
  if(S.mod!=="scan") toast(res.msg+(res.dim?` · ${res.dim}`:""), res.ok?"":"bad");
  const sel=$("#sc-ord"); if(sel && S.scan.ord) sel.value=S.scan.ord;
}
function nextSimStage(o, mode){
  if(mode!=="auto"){ const st=STAGES.find(s=>s.k===mode); for(let i=1;i<=o.sc.length;i++) if(boxStage(o,i)===st.i-1) return st.i-1; return -1; }
  const have=new Set(); for(let i=1;i<=o.sc.length;i++) have.add(boxStage(o,i));
  for(const c of [0,1,3,4]) if(have.has(c)) return c;
  return -1;
}
function simulateNext(){
  const o=S.scan.ord?ordOf(S.scan.ord):null; if(!o){ toast("Elige primero un pedido","bad"); return; }
  const s0=nextSimStage(o,S.scan.mode); if(s0<0){ toast(S.scan.mode==="auto"?`No hay cajas de ${o.folio} que puedan avanzar ahora (¿falta registrar la salida del viaje?)`:`Todas las cajas de ${o.folio} ya tienen ese paso`); return; }
  for(let i=1;i<=o.sc.length;i++) if(boxStage(o,i)===s0){ submitScan(boxCode(o.folio,i,o.sc.length)); return; }
}
function simulateAll(){
  const o=S.scan.ord?ordOf(S.scan.ord):null; if(!o){ toast("Elige primero un pedido","bad"); return; }
  const s0=nextSimStage(o,S.scan.mode); if(s0<0){ toast(`No hay cajas de ${o.folio} que puedan avanzar ahora`); return; }
  let k=0, last=null;
  for(let i=1;i<=o.sc.length;i++) if(boxStage(o,i)===s0){ const r=doScan(boxCode(o.folio,i,o.sc.length),S.scan.mode,{via:S.scan.via}); if(!r.ok){ S.scan.feed.unshift({...r,at:Date.now()}); beep(false); refreshScan(); return; } k++; last=r; }
  S.scan.feed.unshift({ok:true,kind:"ok",o,msg:`${k} caja${k===1?"":"s"} de ${o.folio}: ${last?last.stage.t:""}`,at:Date.now()}); beep(true); refreshScan();
}
async function camStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("Este navegador no permite usar la cámara aquí","bad"); return; }
  try{ camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}); }
  catch(e){ toast(SANDBOX?"La cámara solo funciona al abrir el sistema en su propia página web.":"No se pudo abrir la cámara: permiso denegado.","bad"); return; }
  S.scan.cam=true; render();
  const det = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null;
  const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
  clearInterval(camTimer);
  camTimer = setInterval(async()=>{
    const v=$("#cam"); if(!v||v.readyState<2) return; let code=null;
    try{ if(det){ const r=await det.detect(v); if(r.length) code=r[0].rawValue; }
         else if(window.jsQR){ cv.width=v.videoWidth; cv.height=v.videoHeight; cx.drawImage(v,0,0); const im=cx.getImageData(0,0,cv.width,cv.height); const r=jsQR(im.data,im.width,im.height); if(r) code=r.data; } }catch(e){}
    if(code && (code!==lastCode || Date.now()-lastAt>2500)){ lastCode=code; lastAt=Date.now(); submitScan(code); }
  },250);
}
function camStop(){ clearInterval(camTimer); camTimer=null; if(camStream) camStream.getTracks().forEach(t=>t.stop()); camStream=null; S.scan.cam=false; }
function attachCam(){ const v=$("#cam"); if(v&&camStream){ v.srcObject=camStream; v.play().catch(()=>{}); } }

  const os=DB.ord.filter(o=>o.cli===c.id), fs=DB.fac.filter(f=>f.cli===c.id), s=id==="new"?null:cliStats(c);
  openModal({title:id==="new"?"Nuevo cliente":`${c.razon}`, wide:true, key:"cli:"+id,
    html:`${s?`<div class="row4" style="margin-bottom:14px">${[["Pedidos",s.pedidos],["Cajas",s.cajas],["Facturado",money0(s.facturado)],["Saldo",money0(s.saldo)]].map(([a,b])=>`<div style="background:var(--soft);padding:10px;border-radius:10px"><div class="xs mut">${a}</div><b class="mono">${b}</b></div>`).join("")}</div>`:""}
    ${cliForm(c)}
    ${s&&fs.length?`<div class="h2" style="margin-top:18px">Facturas y XML</div>${fs.map(f=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><span class="sm"><b>${esc(f.id)}</b> · ${fday(f.fecha)} · ${money(f.total)} <span class="pill ${facEstado(f)==="pagada"?"ok":facEstado(f)==="vencida"?"bad":"warn"}">${esc(FAC_ST[facEstado(f)])}</span></span><span class="chips"><button class="btn sec sm" data-act="verfac" data-arg="${esc(f.id)}">Ver</button><button class="btn sec sm" data-act="xmlfac" data-arg="${esc(f.id)}">XML</button>${f.ords[0]?`<button class="btn sec sm" data-act="open" data-arg="${esc(f.ords[0])}">Envío</button>`:""}</span></div>`).join("")}
      <button class="btn sec sm" style="margin-top:10px" data-act="xmlcli" data-arg="${esc(c.id)}">Descargar todos los XML (.zip)</button>`:""}
    ${s&&os.length?`<div class="h2" style="margin-top:18px">Pedidos</div>${os.slice(0,12).map(o=>`<div class="sm" style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);cursor:pointer" data-act="open" data-arg="${esc(o.folio)}"><span><b>${esc(o.folio)}</b> · ${esc(dest(o.dest).name)} · ${o.totals.piezas} cajas</span>${badge(o)}</div>`).join("")}`:""}`,
    actions:`<button class="btn sm" data-act="savecli" data-arg="${esc(id)}">Guardar cliente</button>`});
}

/* ==================== Facturación ==================== */
function pendientesFacturar(){ return DB.ord.filter(o=>!o.cancelado&&stIdx(o)>=1&&!o.fac.some(id=>{ const f=facOf(id); return f&&f.estado!=="cancelada"; })); }
function modFact(){
  const tabs=[["fac","Facturas"],["pend","Por facturar"],["cob","Cobranza"]];
  const head=`${ptitle("Facturación",`<span class="pill warn">CFDI 4.0 · modo demostración</span>`)}
    <div class="note info sm" style="margin-bottom:14px">El sistema arma la factura y su XML con los datos del pedido (clave SAT 78101800, IVA, retenciones, uso de CFDI). El <b>timbrado</b> con el SAT se hace conectando un proveedor autorizado (PAC); en esta demo el XML sale <b>sin sello ni validez fiscal</b>. El complemento Carta Porte se agrega cuando el traslado usa vía federal.</div>
    <div class="subtabs">${tabs.map(([k,t])=>`<button class="${S.ftab===k?"on":""}" data-act="ftab" data-arg="${k}">${t}</button>`).join("")}</div>`;
  if(S.ftab==="pend"){
    const p=pendientesFacturar();
    return head+`<div class="card" style="padding:16px"><div class="scroll"><table class="rt"><thead><tr><th>Pedido</th><th>Cliente</th><th>Guía</th><th>Estado del envío</th><th class="r">Total</th><th></th></tr></thead><tbody>
    ${p.map(o=>`<tr><td><b>${esc(o.folio)}</b></td><td>${esc(cliOf(o.cli).razon)}</td><td class="sm">${esc(o.guia)}</td><td class="sm">${badge(o)}<div class="mut" style="margin-top:3px">${esc(envioLinea(o))}</div></td><td class="r mono">${money(o.totals.total)}</td><td class="r"><button class="btn sec sm" data-act="open" data-arg="${esc(o.folio)}">Envío</button> <button class="btn sm" data-act="facturar" data-arg="${esc(o.folio)}">Facturar</button></td></tr>`).join("")||`<tr><td colspan="6" class="mut c" style="padding:24px">No hay pedidos pendientes de facturar.</td></tr>`}</tbody></table></div></div>`;
  }
  if(S.ftab==="cob"){
    const abiertas=DB.fac.filter(f=>["emitida","vencida"].includes(facEstado(f))&&facSaldo(f)>0.5);
    const bucket=f=>{ const d=Math.floor((Date.now()-f.venc)/DAY); return d<=0?0:d<=15?1:d<=30?2:3; };
    const tot=[0,0,0,0]; abiertas.forEach(f=>tot[bucket(f)]+=facSaldo(f));
    const lbl=["Corriente","Vencido 1–15 días","Vencido 16–30 días","Vencido +30 días"];
    const por={}; abiertas.forEach(f=>{ (por[f.cli]=por[f.cli]||[0,0,0,0])[bucket(f)]+=facSaldo(f); });
    return head+`<div class="kpis">${tot.map((v,i)=>`<div class="kpi ${i===0?"g":i===1?"w":""}"><small>${lbl[i]}</small><b>${money0(v)}</b></div>`).join("")}</div>
    <div class="card" style="padding:16px"><div class="scroll"><table class="rt"><thead><tr><th>Cliente</th>${lbl.map(l=>`<th class="r">${l}</th>`).join("")}<th class="r">Total</th></tr></thead><tbody>
    ${Object.entries(por).map(([id,v])=>`<tr><td>${esc(cliOf(id).razon)}</td>${v.map(x=>`<td class="r mono">${x?money0(x):"—"}</td>`).join("")}<td class="r mono"><b>${money0(v.reduce((a,b)=>a+b,0))}</b></td></tr>`).join("")||`<tr><td colspan="6" class="mut c" style="padding:24px">Sin saldos por cobrar.</td></tr>`}</tbody></table></div></div>`;
  }
  const fl=DB.fac;
  return head+`<div class="card" style="padding:16px"><div class="toolbar"><span class="mut sm">${fl.length} factura(s)</span><button class="btn sec sm" style="margin-left:auto" data-act="xmlall">Descargar todos los XML (.zip)</button></div>
  <div class="scroll"><table class="rt"><thead><tr><th>Factura</th><th>Pedido</th><th>Cliente</th><th>Estado del envío</th><th class="r">Total</th><th class="r">Saldo</th><th>Cobro</th><th></th></tr></thead><tbody>
  ${fl.map(f=>{ const st=facEstado(f), os=f.ords.map(ordOf).filter(Boolean), o=os[0]; return `<tr class="click" data-act="verfac" data-arg="${esc(f.id)}"><td><b>${esc(f.id)}</b><div class="xs mut">${fday(f.fecha)}</div></td><td>${o?`<b>${esc(o.folio)}</b>${os.length>1?` <span class="pill">+${os.length-1}</span>`:""}<div style="margin-top:3px">${badge(o)}</div>`:"—"}</td><td>${esc(cliOf(f.cli).razon)}</td><td class="sm">${o?esc(envioLinea(o)):"—"}</td><td class="r mono">${money(f.total)}</td><td class="r mono">${st==="pagada"||st==="cancelada"?"—":money(facSaldo(f))}</td><td><span class="pill ${st==="pagada"?"ok":st==="vencida"?"bad":st==="borrador"?"":"warn"}">${esc(FAC_ST[st])}</span>${f.estado==="borrador"||st==="pagada"||st==="cancelada"?"":`<div class="xs mut" style="margin-top:3px">vence ${fday(f.venc)}</div>`}</td><td class="r"><div class="chips" style="justify-content:flex-end"><button class="btn sec sm" data-act="verfac" data-arg="${esc(f.id)}">Factura</button> <button class="btn sec sm" data-act="xmlfac" data-arg="${esc(f.id)}">XML</button>${o?`<button class="btn sec sm" data-act="open" data-arg="${esc(o.folio)}">Envío</button>`:""}</div></td></tr>`; }).join("")||`<tr><td colspan="8" class="mut c" style="padding:24px">Aún no hay facturas.</td></tr>`}</tbody></table></div></div>`;
}
function openFac(id){
  const f=facOf(id); if(!f) return; const st=facEstado(f), saldo=facSaldo(f);
  const pagos=f.pagos.map(p=>`<div class="sm" style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${fday(p.at)} · ${esc(p.ref||"")}</span><b>${money(p.monto)}</b></div>`).join("");
  openModal({title:`Factura ${f.id}`, wide:true, key:"fac:"+id,
    html:`<div class="sheet" id="doc-sheet">${factDoc(f)}</div>
    <div class="noprint"><div class="h2" style="margin:16px 0 0">Envío${f.ords.length>1?"s":""} de esta factura</div>${f.ords.map(ordOf).filter(Boolean).map(envioResumen).join("")||`<div class="mut sm">Sin pedidos ligados.</div>`}</div>
    <div class="grid g2" style="margin-top:14px">
      <div><div class="h2" style="margin-bottom:6px">Pagos</div>${pagos||`<div class="mut sm">Sin pagos registrados.</div>`}<div class="sm" style="margin-top:6px">Saldo: <b>${money(saldo)}</b></div></div>
      ${["emitida","vencida"].includes(st)?`<div><div class="h2" style="margin-bottom:6px">Registrar pago</div><div class="row3"><div><label for="pg-m">Monto</label><input id="pg-m" type="number" step="0.01" value="${saldo.toFixed(2)}"></div><div><label for="pg-f">Forma</label><select id="pg-f"><option value="03">03 Transferencia</option><option value="01">01 Efectivo</option><option value="02">02 Cheque</option><option value="04">04 Tarjeta</option></select></div><div><label for="pg-r">Referencia</label><input id="pg-r" placeholder="SPEI…"></div></div><button class="btn ok sm" style="margin-top:8px" data-act="pagar" data-arg="${esc(f.id)}">Registrar pago</button></div>`:""}
    </div>`,
    actions:`${st==="borrador"?`<button class="btn sm" data-act="emitir" data-arg="${esc(f.id)}">Emitir (demo, sin timbre)</button>`:""}<button class="btn sec sm" data-act="xmlfac" data-arg="${esc(f.id)}">Descargar XML</button>${SANDBOX?"":`<button class="btn sec sm" data-act="printdoc">Imprimir / PDF</button>`}${st!=="cancelada"&&st!=="pagada"?`<button class="btn ghost sm" style="color:var(--bad)" data-act="cancelfac" data-arg="${esc(f.id)}">Cancelar factura</button>`:""}`});
}
function reopenFac(id){ if(S.modals.length&&S.modals[S.modals.length-1].key==="fac:"+id) S.modals.pop(); openFac(id); }
function xmlZip(list, name){
  if(!list.length){ toast("No hay facturas para descargar","bad"); return; }
  if(SANDBOX){ download(name, list.map(f=>`<!-- ${f.id}.xml -->\n${cfdiXML(f)}`).join("\n")); return; }
  download(name, zipStore(list.map(f=>({name:`${f.id}.xml`, text:cfdiXML(f)}))), "application/zip");
}

  <td class="r" style="white-space:nowrap"><button class="btn sec sm" data-act="doc" data-arg="${S.docTab}|${esc(o.folio)}">Documento</button> <button class="btn sm" data-act="open" data-arg="${esc(o.folio)}">Envío</button> <button class="btn sec sm" data-act="labels" data-arg="${esc(o.folio)}" data-from="sistema">QR</button></td></tr>`).join("")||`<tr><td colspan="7" class="mut c" style="padding:24px">Sin documentos todavía. Confirma un pedido para generarlos.</td></tr>`}</tbody></table></div></div>`;

/* ==================== Reportes ==================== */
function repOrders(){ const lim = S.repDays==="0" ? 0 : Date.now()-(+S.repDays)*DAY; return DB.ord.filter(o=>!o.cancelado && !o.practice && o.createdAt>=lim); }
function entregaDias(o){ const h=[...o.history].reverse().find(x=>x.k==="entregado"); return h ? (h.at-o.createdAt)/DAY : null; }
function modReportes(){
  const os=repOrders();
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  const ent=os.map(entregaDias).filter(x=>x!=null);
  const porCli={}; os.forEach(o=>{ const r=porCli[o.cli]=porCli[o.cli]||{n:0,cajas:0,val:0}; r.n++; r.cajas+=o.totals.piezas; r.val+=o.totals.total; });
  const porDest=CFG.destinos.map(d=>{ const a=os.filter(o=>o.dest===d.id); const e=a.map(entregaDias).filter(x=>x!=null); return {d,n:a.length,cajas:sum(a,o=>o.totals.piezas),m3:sum(a,o=>o.totals.m3),kg:sum(a,o=>o.totals.kg),val:sum(a,o=>o.totals.total),dias:e.length?e.reduce((x,y)=>x+y,0)/e.length:null}; });
  const maxV=Math.max(1,...Object.values(porCli).map(r=>r.val));
  return `${ptitle("Reportes",`<label for="rep-d" style="display:none">Periodo</label><select id="rep-d" data-ch="repdays" style="width:auto">${[["7","Últimos 7 días"],["30","Últimos 30 días"],["90","Últimos 90 días"],["0","Todo"]].map(([k,t])=>`<option value="${k}" ${S.repDays===k?"selected":""}>${t}</option>`).join("")}</select><button class="btn sec sm" data-act="repcsv">Exportar CSV</button>`)}
  <div class="kpis"><div class="kpi"><small>Pedidos</small><b>${os.length}</b></div><div class="kpi b"><small>Cajas movidas</small><b>${sum(os,o=>o.totals.piezas)}</b></div><div class="kpi b"><small>Volumen</small><b>${num(sum(os,o=>o.totals.m3),1)} m³</b></div><div class="kpi g"><small>Valor cotizado</small><b>${money0(sum(os,o=>o.totals.total))}</b></div><div class="kpi w"><small>Ticket promedio</small><b>${money0(os.length?sum(os,o=>o.totals.total)/os.length:0)}</b></div><div class="kpi"><small>Entrega promedio</small><b>${ent.length?num(ent.reduce((a,b)=>a+b,0)/ent.length,1)+" d":"—"}</b></div></div>
  <div class="grid g2"><div class="card"><div class="h2">Ventas por cliente</div><div class="bars">${Object.entries(porCli).sort((a,b)=>b[1].val-a[1].val).map(([id,r])=>bar(cliOf(id).razon.slice(0,22),r.val,maxV,"r",money0(r.val))).join("")||`<div class="mut">Sin datos.</div>`}</div></div>
  <div class="card"><div class="h2">Por destino</div><div class="scroll"><table><thead><tr><th>Destino</th><th class="r">Ped.</th><th class="r">Cajas</th><th class="r">m³</th><th class="r">Valor</th><th class="r">Días</th></tr></thead><tbody>${porDest.map(x=>`<tr><td>${esc(x.d.name)}</td><td class="r mono">${x.n}</td><td class="r mono">${x.cajas}</td><td class="r mono">${num(x.m3,1)}</td><td class="r mono">${money0(x.val)}</td><td class="r mono">${x.dias!=null?num(x.dias,1):"—"}</td></tr>`).join("")}</tbody></table></div></div></div>
  <div class="card" style="margin-top:16px"><div class="h2">Detalle por cliente</div><div class="scroll"><table><thead><tr><th>Cliente</th><th class="r">Pedidos</th><th class="r">Cajas</th><th class="r">Valor</th></tr></thead><tbody>${Object.entries(porCli).sort((a,b)=>b[1].val-a[1].val).map(([id,r])=>`<tr><td>${esc(cliOf(id).razon)}</td><td class="r mono">${r.n}</td><td class="r mono">${r.cajas}</td><td class="r mono">${money(r.val)}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function csvOf(rows){ return "﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"); }
