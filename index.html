/* ==================== Unidades: capacidad y ocupación ==================== */
function viajeCap(v){ const t=CFG.camiones||{}; return t[v.tipo]||t.torton||{t:"Unidad",m3:45,kg:12000}; }
function viajeOcc(v){
  let m3a=0,kga=0,m3l=0,kgl=0,n=0,nl=0;
  v.ords.forEach(fo=>{ const o=ordOf(fo); if(!o) return; const k=o.sc.length, m3b=o.totals.m3/k, kgb=o.totals.kg/k;
    for(let i=0;i<k;i++){ m3a+=m3b; kga+=kgb; n++; if(+o.sc[i]>=2){ m3l+=m3b; kgl+=kgb; nl++; } } });
  const c=viajeCap(v);
  return {cap:c, m3a,kga,m3l,kgl,n,nl, pctA:Math.max(m3a/c.m3,kga/c.kg), pctL:Math.max(m3l/c.m3,kgl/c.kg)};
}
function occBar(label, pct, txt){
  const p=Math.min(100,Math.round(pct*100)), cls=pct>1?"over":pct>.7?"hi":"";
  return `<div class="occ"><div class="occ-h"><span>${label}</span><b>${Math.round(pct*100)}%</b></div><div class="occ-t"><i class="${cls}" style="width:${p}%"></i></div><div class="xs mut">${txt}</div></div>`;
}
function viajeOccHTML(v){
  const o=viajeOcc(v), c=o.cap;
  const t=`${num(o.m3l,1)} de ${c.m3} m³ · ${num(o.kgl,0)} de ${num(c.kg,0)} kg · ${o.nl} de ${o.n} cajas`;
  const ta=`${num(o.m3a,1)} m³ · ${num(o.kga,0)} kg asignados`;
  return occBar(`${esc(c.t)} · cargado`, o.pctL, t) + (o.pctA>o.pctL+0.005 ? occBar("Con lo que falta por subir", o.pctA, ta) : "");
}
function unidadesHoyHTML(){
  const vs=DB.via.filter(v=>v.status!=="cerrado");
  if(!vs.length) return `<div class="mut sm">No hay unidades activas. Crea un viaje en "Viajes y unidades".</div>`;
  return `<div class="grid g3">${vs.map(v=>`<div class="card flat" style="padding:14px"><div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(v.unidad)}</b><span class="pill">${esc(VIA_ST[v.status])}</span></div><div class="xs mut" style="margin-bottom:6px">${esc(v.id)} → ${esc(dest(v.dest).name)} · ${esc(v.operador)}</div>${viajeOccHTML(v)}</div>`).join("")}</div>`;
}

/* ==================== Operación por pedido (modo sencillo) ==================== */
function siguientePaso(o){
  if(o.cancelado||o.status==="entregado") return null;
  if(stIdx(o)<1) return {k:"confirmar", t:"Confirmar pedido"};
  const c=stageCounts(o), pl=n=>`${n} caja${n===1?"":"s"}`;
  if(c[0]>0) return {k:"recibir", n:c[0], t:`Recibir ${pl(c[0])}`};
  if(c[1]>0) return {k:"cargar", n:c[1], t:`Cargar ${pl(c[1])} al camión`};
  if(c[2]>0) return {k:"esperar", n:c[2], t:"Esperando salida del camión"};
  if(c[3]>0) return {k:"llegar", n:c[3], t:`Llegaron ${pl(c[3])} a destino`};
  if(c[4]>0) return {k:"entregar", n:c[4], t:"Entregar y firmar"};
  return null;
}
function moverCajas(o, desde, hasta, k){ let m=0; for(let i=1;i<=o.sc.length&&m<k;i++) if(boxStage(o,i)===desde){ setBox(o,i,hasta); m++; } return m; }
function addInc(o,tipo,detalle,extra){ (o.inc=o.inc||[]).push({tipo,detalle,extra:extra||0,at:Date.now(),por:ROLE?ROLES[ROLE].t:"Sistema"}); }
function accRecibir(o,k,nota,nombre){
  const pend=stageCounts(o)[0]; k=Math.min(k,pend); const m=moverCajas(o,0,1,k), n=o.sc.length;
  if(m<pend) addInc(o,"conteo",`Recepción parcial: llegaron ${m} de ${pend} cajas pendientes${nota?` · ${nota}`:""}`); else if(nota) addInc(o,"nota",nota);
  const rc=atLeast(o,1); o.conf=o.conf||{}; o.conf.recepcion={cajas:rc,de:n,por:ROLE?ROLES[ROLE].t:"Almacén",nombre:nombre||"",nota:nota||"",at:Date.now()};
  o.history.push({k:o.status,at:Date.now(),note:`Almacén confirmó ${rc} de ${n} cajas${nombre?` (${nombre})`:""}${nota?` · ${nota}`:""}`,by:ROLE?ROLES[ROLE].t:"Almacén"});
  syncStatus(o); logEv("Operación","Recepción confirmada",`${o.folio} · ${rc} de ${n} cajas`); saveDB(); return m;
}
function accCargar(o,k,viaId){
  const v=viaOf(viaId); if(!v) return 0; const m=moverCajas(o,1,2,k);
  if(!v.ords.includes(o.folio)) v.ords.push(o.folio); o.viaje=v.id; if(v.status==="abierto") v.status="cargando";
  o.history.push({k:o.status,at:Date.now(),note:`${m} cajas cargadas en ${v.unidad} (${v.id})`,by:ROLE?ROLES[ROLE].t:"Almacén"});
  logEv("Operación","Carga a unidad",`${o.folio} · ${m} cajas → ${v.id}`); saveDB(); return m;
}
function accLlegar(o,k){
  const m=moverCajas(o,3,4,k); syncStatus(o);
  if(m && stIdx(o)<stKey("almacen_destino")) o.history.push({k:o.status,at:Date.now(),note:`${m} cajas llegaron a destino`,by:ROLE?ROLES[ROLE].t:"Operador"});
  logEv("Operación","Llegada a destino",`${o.folio} · ${m} cajas`); saveDB(); return m;
}
function accEntregar(o,d){
  const n=o.sc.length, c=stageCounts(o), disp=c[3]+c[4]; let k=Math.max(0,Math.min(d.cajas||disp,disp)), m=0;
  for(const e of [4,3]) m+=moverCajas(o,e,5,k-m);
  (o.entregas=o.entregas||[]).push({nombre:d.nombre,id:d.id||"",cajas:m,at:Date.now(),firma:d.firma||null});
  const total=atLeast(o,5), por=ROLE?ROLES[ROLE].t:"Operador";
  if(total<n){
    addInc(o,"conteo",`Entrega parcial: ${d.nombre} recibió ${m} cajas; en total ${total} de ${n}, faltan ${n-total}`);
    o.history.push({k:o.status,at:Date.now(),note:`Entrega parcial: ${d.nombre} confirmó ${m} cajas (${total} de ${n})`,by:por});
    logEv("Operación","Entrega parcial",`${o.folio} · ${total} de ${n}`); saveDB(); return {parcial:true,m,total};
  }
  o.pod={nombre:d.nombre,id:d.id||"",notas:d.notas||"",firma:d.firma||null,cajas:n,de:n,at:Date.now()};
  bump(o,"entregado",`Entregado a ${d.nombre}: confirmó ${n} de ${n} cajas${d.firma?" (con firma)":""}`);
  logEv("Operación","Entrega con firma",`${o.folio} · ${d.nombre} · ${n} cajas`); saveDB(); return {parcial:false,m,total:n};
}

function stepperHTML(max,val){

        <div class="row2"><div><label for="mc-it">Tipo de caja</label><select id="mc-it">${o.items.map((it,i)=>`<option value="${i}">${esc(itemName(it))} — declarada ${it.l}×${it.a}×${it.h} cm · ${num(it.kg,1)} kg</option>`).join("")}</select></div><div></div></div>

        <button class="btn sec sm" style="margin-top:10px" data-act="medcheck" data-arg="${esc(o.folio)}">Comparar</button><div id="mc-res" style="margin-top:10px"></div></details>`,
      actions:`<button class="btn" data-act="dorecibir" data-arg="${esc(o.folio)}">Confirmar recepción</button>`}); return;
  }
  if(kind==="cargar"){
    const max=c[1], vias=DB.via.filter(v=>v.dest===o.dest&&["abierto","cargando"].includes(v.status));
    const quick=`<div class="card flat" style="margin-top:12px"><b class="sm">No hay unidad abierta a ${esc(dest(o.dest).name)}. Crea una:</b><div class="row3" style="margin-top:8px"><div><label for="qv-u">Unidad</label><input id="qv-u" placeholder="Unidad 214"></div><div><label for="qv-t">Tipo</label><select id="qv-t">${Object.entries(CFG.camiones).map(([k,t])=>`<option value="${k}">${esc(t.t)} (${t.m3} m³)</option>`).join("")}</select></div><div><label for="qv-o">Operador</label><input id="qv-o" placeholder="Nombre"></div></div><button class="btn sec sm" style="margin-top:8px" data-act="quickvia" data-arg="${esc(o.folio)}">Crear unidad</button></div>`;
    openModal({title:"Cargar al camión", key:"acc", wide:true, html:`${hd}${vias.length?`<label for="ac-via">Unidad</label><select id="ac-via">${vias.map(v=>{ const oc=viajeOcc(v); return `<option value="${v.id}">${esc(v.id)} · ${esc(v.unidad)} (${esc(oc.cap.t)}) · ${Math.round(oc.pctL*100)}% cargado</option>`; }).join("")}</select>`:quick}

function initSignPad(){
  const c=$("#sg-c"); if(!c) return; const x=c.getContext("2d");
  x.lineWidth=4; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#111";
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*c.width/r.width, y:(e.clientY-r.top)*c.height/r.height}; };
  c.addEventListener("pointerdown",e=>{ e.preventDefault(); try{ c.setPointerCapture(e.pointerId); }catch(_){} sgDrawing=true; sgDirty=true; const p=pos(e); x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(p.x+.1,p.y+.1); x.stroke(); });
  c.addEventListener("pointermove",e=>{ if(!sgDrawing) return; e.preventDefault(); const p=pos(e); x.lineTo(p.x,p.y); x.stroke(); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>c.addEventListener(ev,()=>{ sgDrawing=false; }));
}

/* ---- corregir conteo ---- */
function resyncDown(o){
  if(o.cancelado) return;
  const c=stageCounts(o), min=Math.min(...c.map((v,i)=>v?i:9));
  const key = min>=5?"entregado":min>=4?"almacen_destino":min>=3?"transito":min>=1?"almacen_origen":(o.rec&&o.rec.estado==="recolectada"?"recolectado":"confirmado");
  if(stKey(key)>=1 && stKey(key)<stIdx(o)) advance(o,key,"Estatus ajustado por corrección de conteo");
}
function ajustarEtapa(o,i,k,motivo){
  const n=o.sc.length, cur=atLeast(o,i); k=Math.max(0,Math.min(n,k)); if(k===cur) return {ok:true,m:0};
  if(k>cur){
    const need=k-cur, avail=stageCounts(o)[i-1];
    if(need>avail) return {ok:false,msg:`Solo hay ${avail} cajas disponibles en el paso anterior`};
    if(i===2){ const v=o.viaje&&viaOf(o.viaje); if(!v||!["abierto","cargando"].includes(v.status)) return {ok:false,msg:"Asigna primero el pedido a una unidad abierta (usa Cargar al camión)"}; }
    moverCajas(o,i-1,i,need);
  } else {
    const need=cur-k, exact=stageCounts(o)[i];
    if(need>exact) return {ok:false,msg:`${cur-exact} cajas ya avanzaron al paso siguiente; corrige ese paso primero`};
    let m=0; for(let j=n;j>=1&&m<need;j--) if(boxStage(o,j)===i){ setBox(o,j,i-1); m++; }
  }
  const por=ROLE?ROLES[ROLE].t:"Sistema";
  addInc(o,"conteo",`Conteo corregido (${STAGES[i-1].t}): de ${cur} a ${k} de ${n} cajas${motivo?` · ${motivo}`:""}`);
  o.history.push({k:o.status,at:Date.now(),note:`Conteo corregido: ${STAGES[i-1].t} ${cur} → ${k} de ${n}${motivo?` (${motivo})`:""}`,by:por});
  if(i===1){ o.conf=o.conf||{}; o.conf.recepcion={...(o.conf.recepcion||{}),cajas:k,de:n,por,at:Date.now(),nota:motivo||""}; }
  resyncDown(o); syncStatus(o); logEv("Operación","Conteo corregido",`${o.folio} · ${STAGES[i-1].t}: ${cur} → ${k}`); saveDB(); return {ok:true,m:Math.abs(k-cur)};
}
function openCorregir(f){
  const o=ordOf(f); if(!o) return; const n=o.sc.length, v={1:atLeast(o,1),2:atLeast(o,2),4:atLeast(o,4)};
  const row=(i,l)=>`<div class="row2" style="align-items:end;margin-bottom:10px"><div><label for="cj-${i}">${l}</label><input id="cj-${i}" inputmode="numeric" autocomplete="off" value="${v[i]}" data-cur="${v[i]}" style="font-size:22px;font-weight:800;text-align:center"></div><div class="sm mut">de ${n} cajas (ahora ${v[i]})</div></div>`;
  openModal({title:"Corregir conteo", key:"corr", html:`<div style="margin-bottom:8px"><b style="font-size:18px">${esc(o.folio)}</b> ${badge(o)}<div class="sm mut">${esc(o.sol.empresa||o.sol.nombre)} → ${esc(dest(o.dest).name)} · ${n} cajas</div></div>

function ymd(d){ const x=new Date(d); return x.getFullYear()+"-"+pad(x.getMonth()+1,2)+"-"+pad(x.getDate(),2); }
function fromYmd(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); }
function hh(s){ return parseInt(String(s).slice(0,2),10); }
const REC_ST = {solicitada:"Por confirmar", programada:"Programada", recolectada:"Recolectada", no_realizada:"No se pudo", cancelada:"Cancelada"};
function recVentana(r){ return `${r.desde}–${r.hasta}`; }
function recVigente(o){ return !!(o.rec && o.rec.on && o.rec.estado!=="cancelada"); }

function recCount(fecha){ return DB.ord.filter(o=>!o.cancelado && recVigente(o) && o.rec.fecha===fecha).length; }
function diaInfo(fecha){
  const R=CFG.recoleccion, w=fromYmd(fecha).getDay(), bloq=(DB.cal.bloq||{})[fecha];
  if(w===0 || (w===6&&!R.sabado)) return {ok:false, why:"Sin servicio", n:0};
  if(bloq!==undefined) return {ok:false, why:bloq||"Bloqueado", bloq:true, n:recCount(fecha)};
  const n=recCount(fecha); if(n>=R.capDia) return {ok:false, why:"Lleno", n};
  return {ok:true, n};
}
const primerDiaRec = () => ymd(addBiz(Date.now(), CFG.recoleccion.anticipacion));
function recValida(r){
  const m=[], R=CFG.recoleccion;
  if(!r.dir.trim()) m.push("dirección de recolección");
  if(!r.contacto.nombre.trim()) m.push("contacto en sitio");
  if(r.contacto.tel.replace(/\D/g,"").length<8) m.push("teléfono del contacto");
  if(!r.fecha) m.push("día de recolección"); else if(!diaInfo(r.fecha).ok || r.fecha<primerDiaRec()) m.push("un día disponible");
  if(hh(r.hasta)-hh(r.desde)<R.minHoras) m.push(`ventana de al menos ${R.minHoras} horas`);
  return m;
}
function horaOpts(desdeN, hastaN, sel){ let h=""; for(let i=desdeN;i<=hastaN;i++){ const v=pad(i,2)+":00"; h+=`<option value="${v}" ${v===sel?"selected":""}>${v}</option>`; } return h; }

    renderPieces(); renderSummary(); },
  pfield(v,el){ const pc=el.closest(".piece"), it=Q.items[+pc.dataset.i], k=el.dataset.arg;
    if(k==="qty"){ el.value=el.value.replace(/\D/g,"").replace(/^0+/,""); it.qty=parseInt(el.value,10)||0; } else it[k]=Math.max(0,+v||0);
    pc.querySelector(".meta").innerHTML=metaHTML(it); renderSummary(); },
  ack(v,el){ el.value=el.value.replace(/\D/g,""); const max=+el.dataset.max; if(+el.value>max) el.value=max; ackUpd(); },
  fq(v){ S.fq=v; keepFocus(); },
  fcliq(v){ S.fCliQ=v; keepFocus(); },
  logq(v){ S.logQ=v; keepFocus(); },
  cfg(v,el){ const nu=el.dataset.num; setPath(CFG, el.dataset.arg, nu?(+v||0):v); saveCfg(); if(el.dataset.arg.startsWith("brand")) applyBrand(); else DB.ord.forEach(o=>{ o.totals=calc(o.dest,o.items,o.seguro); }); },
  cfgarr(v,el){ const [arr,i,f]=el.dataset.arg.split("|"); const row=getPath(CFG,arr)[+i];
    let val=v; if(el.dataset.num) val = (v===""&&el.dataset.nullable) ? null : (+v||0);
    setPath(row,f,val); saveCfg(); }
};
const CH = {
  fEstado(v){ S.fEstado=v; render(); }, fDest(v){ S.fDest=v; render(); },
  svia(v){ S.scan.via=v; refreshScan(); }, sord(v){ S.scan.ord=v; refreshScan(); },
  repdays(v){ S.repDays=v; render(); },
  qserv(v,el){ Q.serv[el.dataset.arg]=el.checked; if(el.dataset.arg==="recoleccion") renderRec(); if(el.dataset.arg==="seguro") renderSeg(); renderSummary(); },
  recd(v){ ajustaVentana(Q.rec,"desde",v); renderRec(); renderSummary(); },
  rech(v){ ajustaVentana(Q.rec,"hasta",v); renderRec(); renderSummary(); },
  rsd(v){ ajustaVentana(S.rs,"desde",v); openRecResched(S.rs.folio,true); },
  rsh(v){ ajustaVentana(S.rs,"hasta",v); openRecResched(S.rs.folio,true); },
  segfile(v,el){ leerArchivo(el.files[0], f=>{ Q.seguro.file=f; renderSeg(); toast("Factura de la mercancía adjunta"); }); },
  segfile2(v,el){ leerArchivo(el.files[0], f=>{ S.segTmp=f; toast("Factura adjunta; guarda el seguro para aplicarla"); }); },
  cfgbool(v,el){ setPath(CFG, el.dataset.arg, el.checked); saveCfg(); DB.ord.forEach(o=>{ o.totals=calc(o.dest,o.items,o.seguro); }); },
  qnotif(v,el){ Q.notif[el.dataset.arg]=el.checked; },
  cfgocurre(v,el){ CFG.destinos[+el.dataset.arg].ocurre=el.checked; saveCfg(); },
  descon(v,el){ CFG.desc.on=el.checked; saveCfg(); },
  logofile(v,el){ const f=el.files[0]; if(!f) return; if(f.size>1.5e6){ toast("Imagen muy pesada (máx. 1.5 MB)","bad"); return; }
    const r=new FileReader(); r.onload=()=>{ CFG.brand.logo=r.result; saveCfg(); render(); toast("Logo actualizado"); }; r.readAsDataURL(f); },
  cfgfile(v,el){ const f=el.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const c=JSON.parse(r.result); if(!c.cajas||!c.destinos||!c.brand) throw 0; CFG=c; saveCfg(); Q=newQ(); render(); toast("Configuración importada"); }catch(_){ toast("Archivo de configuración inválido","bad"); } }; r.readAsText(f); }
};
const FORM = {
  track(){ S.track=$("#t-in").value; render(); },
  login(f){ const pin=$("#pin").value; let role=f.querySelector("input[name=role]:checked").value;
    if(pin===CFG.devPin) role="dev"; else if(pin!==CFG.pin){ toast("PIN incorrecto","bad"); $("#pin").value=""; return; }
    ROLE=role; store.set(KEY_ROLE,role); S.mod=ROLES[role].mods[0]; logEv("Acceso","Inicio de sesión",ROLES[role].t); saveDB();
    if(S.pendingScan){ S.mod="scan"; runPendingScan(); } if(S.pendingGuia){ render(); runPendingScan(); return; } render(); },
  guia(){ const i=$("#gi"), f=i.value.trim().toUpperCase(); if(!f) return; i.value=""; guiaPendiente(f); },
  scan(){ const i=$("#scan-in"), c=i.value.trim(); if(!c) return; submitScan(c); i.value=""; i.focus(); },
  newvia(){ const u=$("#nv-u").value.trim(); if(!u){ toast("Escribe la unidad","bad"); return; }
    const v={id:"V-"+pad(nextSeq("via",1),4),unidad:u,placas:$("#nv-p").value.trim()||"—",operador:$("#nv-o").value.trim()||"—",dest:$("#nv-d").value,tipo:$("#nv-t").value,status:"abierto",ords:[],fecha:Date.now()};
    DB.via.unshift(v); logEv("Viajes","Viaje creado",`${v.id} · ${u}`); saveDB(); render(); toast("Viaje creado"); }
};
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const f=ACT[el.dataset.act]; if(f) f(el.dataset.arg, el, e);
});
document.addEventListener("input", e=>{ const el=e.target.closest("[data-in]"); if(!el) return; const f=INP[el.dataset.in]; if(f) f(el.value, el); });
document.addEventListener("change", e=>{ const el=e.target.closest("[data-ch],[data-in=qdest],[data-in=ptipo]"); if(!el) return;
  if(el.dataset.ch){ const f=CH[el.dataset.ch]; if(f) f(el.value, el); return; } });
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset && t.dataset.in==="pfield" && t.dataset.arg==="qty"){ const it=Q.items[+t.closest(".piece").dataset.i]; if(!(it.qty>=1)){ it.qty=1; t.value="1"; t.closest(".piece").querySelector(".meta").innerHTML=metaHTML(it); renderSummary(); } }
});
document.addEventListener("submit", e=>{ const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault(); const h=FORM[f.dataset.form]; if(h) h(f); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(S.modals.length) closeModal(); else if(S.drawer){ S.drawer=null; renderOverlay(); } } });
window.addEventListener("storage", e=>{ if(e.key===KEY_DB && e.newValue){ try{ DB=JSON.parse(e.newValue); }catch(_){ return; } const a=document.activeElement; if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))) render(); }
  if(e.key===KEY_CFG && e.newValue){ try{ CFG=JSON.parse(e.newValue); }catch(_){} } });

/* ==================== Arranque ==================== */
/* Una caja escaneada con la cámara normal del teléfono abre la dirección #s.FOLIO.CAJA.TOTAL y se registra sola. */
function takeScanHash(){
  const h=(location.hash||"").slice(1); let m;
  if(m=h.match(/^g\.([A-Za-z0-9-]+)$/)){ S.pendingGuia=m[1]; S.view="sistema"; S.mod="oper"; try{ history.replaceState(null,"","#sistema"); }catch(e){} return true; }
  if(m=h.match(/^t\.([A-Za-z0-9-]+)$/)){ S.view="rastreo"; S.track=m[1]; S.done=null; return true; }
  if(!h.startsWith("s.")) return false;
  S.pendingScan="#"+h; S.view="sistema"; S.mod="scan"; try{ history.replaceState(null,"","#escaner"); }catch(e){} return true;
}
function runPendingScan(){
  if(S.pendingGuia&&ROLE){ const f=S.pendingGuia; S.pendingGuia=null; setTimeout(()=>guiaPendiente(f),0); return; }
  if(!S.pendingScan||!ROLE) return;
  if(!allowed("scan")){ S.scanResult={ok:false,kind:"bad",msg:"Tu perfil no puede registrar escaneos"}; S.pendingScan=null; return; }
  const r=doScan(S.pendingScan,"auto",{via:S.scan.via}); S.pendingScan=null; r.at=Date.now();
  S.scan.feed.unshift(r); if(r.o) S.scan.ord=r.o.folio; S.scanResult=r; S.noFocus=true; beep(r.ok);
}
window.addEventListener("hashchange",()=>{ if(takeScanHash()){ runPendingScan(); render(); } });
(function boot(){
  if(takeScanHash()) runPendingScan();
  else { const h=(location.hash||"").slice(1);
    if(h==="escaner"){ S.view="sistema"; S.mod="scan"; } else if(["rastreo","sistema","cotizar"].includes(h)) S.view=h; }
  render();
})();

</script>
