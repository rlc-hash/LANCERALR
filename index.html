<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotizador ALR</title>
<style>
:root{
  --c1:#fb0c0f; --c2:#14327d;
  --bg:#f4f6fa; --card:#fff; --ink:#14213d; --mut:#64708a; --line:#e3e8f0;
  --ok:#168a4a; --warn:#b7791f; --bad:#c53030; --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* header */
header.top{background:var(--c2);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.2)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:42px;width:auto;max-width:160px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.brand b{font-size:15px;letter-spacing:.2px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:transparent;border:0;color:#cfd8ea;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600}
nav.tabs button:hover{background:rgba(255,255,255,.1);color:#fff}
nav.tabs button.on{background:var(--c1);color:#fff}
.stripe{height:4px;background:linear-gradient(90deg,var(--c1),var(--c1) 40%,#fff 40%,#fff 42%,var(--c2) 42%)}
/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 18%,transparent)}
input.bad{border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--c1);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec{background:#fff;color:var(--c2);border:1.5px solid var(--line)}
.btn.dark{background:var(--c2)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--c1);padding:6px 10px}
.mut{color:var(--mut)} .sm{font-size:13px} .r{text-align:right} .mono{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f9;color:var(--c2);white-space:nowrap}
.pill.ok{background:#e3f5ea;color:var(--ok)} .pill.warn{background:#fdf1d9;color:var(--warn)} .pill.bad{background:#fde6e6;color:var(--bad)} .pill.red{background:color-mix(in srgb,var(--c1) 12%,#fff);color:var(--c1)}
.note{background:#fff8e6;border:1px solid #f3dca2;color:#7a5a10;padding:10px 12px;border-radius:10px;font-size:13px}
.note.info{background:#eef4ff;border-color:#c9daf8;color:#2a4a85}
.hero{background:linear-gradient(135deg,var(--c2),color-mix(in srgb,var(--c2) 78%,#000));color:#fff;padding:34px 0 70px}
.hero h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.5px}
.hero p{margin:8px 0 0;color:#d6def0;max-width:560px}
.pull{margin-top:-48px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.sticky{position:sticky;top:84px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static}nav.tabs button{padding:8px 9px;font-size:13px}.brand b{display:none}}
.stepn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c1);color:#fff;font-weight:800;font-size:13px;margin-right:8px}
.h2{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.row2,.row3{grid-template-columns:1fr}}
.piece{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfd}
.piece .head{display:grid;grid-template-columns:1fr 90px 36px;gap:10px;align-items:end}
.piece .dim{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.piece .meta{font-size:12px;color:var(--mut);margin-top:8px}
.x{border:0;background:#fff;border:1.5px solid var(--line);border-radius:9px;height:40px;cursor:pointer;color:var(--bad);font-size:18px}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.sum dt{color:var(--mut)} .sum dd{margin:0;text-align:right;font-weight:600}
.sum .tot{border-top:2px dashed var(--line);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.sum .tot b{font-size:30px;color:var(--c2);letter-spacing:-1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}
.chk input{width:auto;margin-top:3px}
.chk:has(input:checked){border-color:var(--c1);background:color-mix(in srgb,var(--c1) 6%,#fff)}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 22px 38px}
.tl li:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .dot{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.tl li.done .dot{background:var(--ok);border-color:var(--ok)}
.tl li.done:before{background:var(--ok)}
.tl li.cur .dot{background:var(--c1);border-color:var(--c1);box-shadow:0 0 0 5px color-mix(in srgb,var(--c1) 22%,transparent)}
.tl li.todo{color:#9aa5bb}
.tl b{display:block}
.tl .when{font-size:12px;color:var(--mut)}
/* panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border-left:5px solid var(--c1)}
.kpi small{color:var(--mut);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.kpi b{display:block;font-size:26px;letter-spacing:-.5px;margin-top:2px}
.subtabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
.subtabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--mut)}
.subtabs button.on{background:var(--c2);border-color:var(--c2);color:#fff}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f7f9fd}
.scroll{overflow-x:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:160px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(640px,100%);height:100%;overflow:auto;padding:20px;animation:in .2s}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:400px;width:100%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--c2);color:#fff;padding:12px 20px;border-radius:12px;z-index:60;box-shadow:var(--shadow);font-weight:600}
pre.code{background:#0f1b33;color:#cfe3ff;padding:14px;border-radius:10px;overflow:auto;font-size:12px;max-height:300px;margin:0;white-space:pre-wrap}
.bar{height:10px;border-radius:9px;background:#e9edf5;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c1)}
.logo-prev{height:60px;max-width:200px;object-fit:contain;background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:6px}
.ok-big{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}
footer{padding:30px 16px;text-align:center;color:var(--mut);font-size:12px}
@media print{
  body{background:#fff} header.top,.stripe,.noprint,footer,.toast,.subtabs,.kpis{display:none!important}
  .drawer-bg{position:static;background:none;display:block}.drawer{width:100%;height:auto;padding:0;animation:none;overflow:visible}
  .card{box-shadow:none;border:1px solid #bbb}
  body.printing>*:not(#print-root){display:none!important}
}
#print-root{display:none}
@media print{body.printing #print-root{display:block}}
</style>
</head>
<body>

<div id="print-root"></div>

/* ==================== Cálculo ==================== */
function pieceCalc(it, destId){
  const m3u = it.l*it.a*it.h/1e6;
  const m3 = m3u*it.qty, kg = it.kg*it.qty, kgVol = m3*CFG.volFactor;
  let unit=0, line=0, est=false;
  if(it.custom){
    est = true;
    const d = CFG.destinos.find(x=>x.id===destId);
    const cob = Math.max(kg, kgVol);
    line = cob*(d?d.kgRate:0); unit = it.qty? line/it.qty : 0;
  } else {
    const c = CFG.cajas.find(x=>x.id===it.cajaId);
    unit = c ? (c.prices[destId]||0) : 0; line = unit*it.qty;
  }
  return {m3, kg, kgVol, unit, line, est};
}
function calc(destId, items){
  let m3=0,kg=0,kgVol=0,kgCob=0,sub=0,piezas=0,est=false;
  const lines = items.map(it=>{
    const p = pieceCalc(it,destId);
    m3+=p.m3; kg+=p.kg; kgVol+=p.kgVol; kgCob+=it.custom?Math.max(p.kg,p.kgVol):p.kg; sub+=p.line; piezas+=it.qty; est=est||p.est;
    return {...it, ...p};
  });
  const minApplied = sub>0 && sub<CFG.minimo;
  const subtotal = sub>0 ? Math.max(sub, CFG.minimo) : 0;
  const iva = subtotal*CFG.iva/100;
  return {lines, piezas, m3, kg, kgVol, kgCob, sub, subtotal, minApplied, iva, total:subtotal+iva, est};
}
const dest = id => CFG.destinos.find(d=>d.id===id) || {name:id,transit:""};
const itemName = it => it.custom ? `Medida especial ${it.l}×${it.a}×${it.h} cm` : (CFG.cajas.find(c=>c.id===it.cajaId)||{name:it.name}).name;

  if(Q.sol.tel.replace(/\D/g,"").length<8) m.push("teléfono");
  if(!Q.dst.nombre.trim()) m.push("destinatario");
  if(!Q.dst.dir.trim()) m.push("dirección de entrega");
  if(Q.dst.tel.replace(/\D/g,"").length<8) m.push("teléfono del destinatario");
  if(Q.items.some(i=>!(i.qty>=1))) m.push("cantidad de cajas");
  if(Q.items.some(i=>i.custom&&!(i.l>0&&i.a>0&&i.h>0&&i.kg>0))) m.push("medidas de la pieza especial");
  return {ok:!m.length, msg:m.length?"Falta: "+m.join(", "):""};

function timelineHTML(o, publico=true){
  const cur = stIdx(o);
  if(o.cancelado) return `<div class="note" style="background:#fde6e6;border-color:#f3b4b4;color:#8a1f1f">Este pedido fue cancelado.</div>`;
  return `<ul class="tl">${CFG.steps.map((s,i)=>{
    const h = [...o.history].reverse().find(x=>x.k===s.k);
    const cls = i<cur?"done":i===cur?(s.k==="entregado"?"done":"cur"):"todo";
    return `<li class="${cls}"><span class="dot">${cls==="done"?"✓":""}</span><b>${esc(s.t)}</b>
      <span class="when">${h?fdate(h.at):"Pendiente"}</span>
      ${h&&h.note&&publico?`<div class="sm">${esc(h.note)}</div>`:""}
      ${cls==="cur"?`<div class="sm mut">${esc(s.d)}</div>`:""}</li>`;
  }).join("")}</ul>`;
}

    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid ${CFG.brand.c1};padding-bottom:10px">
      <img src="${esc(CFG.brand.logo||LOGO_DEFAULT)}" style="height:50px"><div style="text-align:right"><div style="font-size:12px">HOJA DE EMBARQUE</div><div style="font-size:26px;font-weight:800">${esc(o.folio)}</div></div></div>
    <p style="font-size:15px"><b>Ruta:</b> ${esc(CFG.origen)} → ${esc(d.name)} (${esc(d.transit)}) &nbsp; <b>Guía:</b> ${esc(o.guia||"________")} &nbsp; <b>Fecha:</b> ${fday(o.createdAt)}</p>
    <table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#eee"><th>Cant</th><th>Pieza</th><th>Medidas cm</th><th>kg c/u</th><th>m³</th><th>✓ Cargada</th></tr>
    ${t.lines.map(l=>`<tr><td align="center"><b>${l.qty}</b></td><td>${esc(itemName(l))}</td><td>${l.l}×${l.a}×${l.h}</td><td align="right">${num(l.kg,1)}</td><td align="right">${num(l.m3,3)}</td><td></td></tr>`).join("")}
    <tr><td align="center"><b>${t.piezas}</b></td><td colspan="2"><b>TOTAL</b></td><td align="right"><b>${num(t.kg)} kg</b></td><td align="right"><b>${num(t.m3,3)}</b></td><td></td></tr></table>
    <p style="font-size:14px"><b>Peso volumétrico:</b> ${num(t.kgVol)} kg · <b>Cobrable:</b> ${num(t.kgCob)} kg · <b>Servicios:</b> ${[o.serv.recoleccion&&"Recolección",o.serv.entrega&&"Entrega domicilio",o.serv.seguro&&"Seguro"].filter(Boolean).join(", ")||"Ninguno"}</p>
    <table style="width:100%;font-size:13px"><tr><td valign="top" width="50%"><b>REMITENTE</b><br>${esc(o.sol.nombre)}<br>${esc(o.sol.empresa)}<br>${esc(o.sol.tel)}</td><td valign="top"><b>DESTINATARIO</b><br>${esc(o.dst.nombre)}<br>${esc(o.dst.dir)}<br>${esc(o.dst.tel)}</td></tr></table>
    ${o.obs?`<p style="font-size:13px"><b>Observaciones:</b> ${esc(o.obs)}</p>`:""}
    <div style="display:flex;gap:40px;margin-top:50px;font-size:12px"><div style="flex:1;border-top:1px solid #000;padding-top:4px">Firma operador / recolección</div><div style="flex:1;border-top:1px solid #000;padding-top:4px">Firma almacén</div><div style="flex:1;border-top:1px solid #000;padding-top:4px">Firma recibe destinatario</div></div></div>`;
  if(SANDBOX){ $("#overlay").insertAdjacentHTML("beforeend",`<div class="modal" id="txt-modal" style="overflow:auto;align-items:start"><div class="card" style="max-width:820px;background:#fff">${$("#print-root").innerHTML}<div class="chips" style="margin-top:14px"><button class="btn sec sm" id="txt-close">Cerrar</button></div></div></div>`); $("#txt-close").onclick=()=>$("#txt-modal").remove(); return; }
  document.body.classList.add("printing");
  setTimeout(()=>{ window.print(); document.body.classList.remove("printing"); },50);
}

/* ==================== Render + eventos ==================== */
function render(){
  applyBrand();
  const app = $("#app");
  app.innerHTML = S.view==="cotizar"?viewCotizar():S.view==="rastreo"?viewRastreo():viewPanel();
  if(S.view==="cotizar" && !S.done){ renderPieces(); renderSummary(); renderOcurre(); }
  const o = S.open && ORD.find(x=>x.folio===S.open);
  $("#overlay").innerHTML = (o && S.view==="panel" && S.auth) ? drawer(o) : "";
}
const byFolio = f => ORD.find(o=>o.folio===f);
function advance(o, k, note, by="ALR"){
  o.status = k; o.history.push({k, at:Date.now(), note: note||"", by});
}
function setPath(obj, path, v){ const p=path.split("."); let c=obj; while(p.length>1) c=c[p.shift()]; c[p[0]]=v; }
function rerenderKeep(){ const a=document.activeElement; const id=a&&a.id; const pos=a&&a.selectionStart; render(); if(id){ const e=document.getElementById(id); if(e){ e.focus(); try{e.setSelectionRange(pos,pos)}catch(_){} } } }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-ptab],[data-open],[data-close],[data-advance],[data-saveguia],[data-cancel],[data-print],[data-copytxt],[data-copyjson],[data-dljson],[data-track],[data-new],[data-logout],[data-cfgtab],[data-export-cfg],[data-export-orders],[data-export-csv],[data-reset-orders],[data-reset-all],[data-add-caja],[data-del-caja],[data-add-dest],[data-del-dest],[data-logo-reset],#q-add,#q-send,[data-p=del]");
  if(!t) return;
  const D = t.dataset;
  if(D.go){ S.view=D.go; S.done=null; S.open=null; render(); scrollTo(0,0); }
  else if(D.ptab){ S.ptab=D.ptab; render(); }
  else if(D.cfgtab){ S.cfgTab=D.cfgtab; render(); }
  else if("open" in D){ S.open=D.open; render(); }
  else if("close" in D){ if(e.target===t || t.classList.contains("btn")){ S.open=null; render(); } }
  else if(D.advance){ const o=byFolio(D.advance), i=stIdx(o); const g=$("#d-guia")?.value.trim(); if(g) o.guia=g;
      if(i<1 && !o.guia){ toast("Asigna un número de guía para confirmar"); $("#d-guia")?.classList.add("bad"); $("#d-guia")?.focus(); return; }
      advance(o, CFG.steps[i+1].k, $("#d-note")?.value.trim()); saveOrd(); render(); toast("Checkpoint registrado"); }
  else if(D.saveguia){ const o=byFolio(D.saveguia); const g=$("#d-guia").value.trim(), n=$("#d-note").value.trim(); const jump=$("#d-jump").value;
      o.guia=g; if(jump){ if(!g && stIdx(o)<1){ toast("Asigna guía primero"); return;} advance(o,jump,n||"Actualizado por ALR"); } else if(n) o.history.push({k:o.status,at:Date.now(),note:n,by:"ALR"}); saveOrd(); render(); toast("Guardado"); }
  else if(D.cancel){ if(ask("¿Cancelar este pedido? Da clic otra vez para confirmar")){ const o=byFolio(D.cancel); o.cancelado=true; o.history.push({k:o.status,at:Date.now(),note:"Pedido cancelado",by:"ALR"}); saveOrd(); render(); } }
  else if(D.print){ printSheet(byFolio(D.print)); }
  else if(D.copytxt){ copy(orderTexto(byFolio(D.copytxt))); }
  else if(D.copyjson){ copy(JSON.stringify(orderJSON(byFolio(D.copyjson)),null,2)); }
  else if(D.dljson){ const o=byFolio(D.dljson); download(o.folio+".json", JSON.stringify(orderJSON(o),null,2)); }
  else if(D.track){ e.preventDefault(); S.view="rastreo"; S.track=D.track; S.done=null; render(); scrollTo(0,0); }
  else if("new" in D){ S.done=null; render(); }
  else if("logout" in D){ S.auth=false; S.open=null; render(); }
  else if("exportCfg" in D){ download("configuracion-alr.json", JSON.stringify(CFG,null,2)); }
  else if("exportOrders" in D){ download("pedidos-alr.json", JSON.stringify(ORD.map(orderJSON),null,2)); }
  else if("exportCsv" in D){
      const rows=[["folio","fecha","estatus","guia","cliente","empresa","destino","piezas","m3","kg_reales","kg_volumetricos","kg_cobrables","subtotal","total"]];
      ORD.forEach(o=>rows.push([o.folio,new Date(o.createdAt).toISOString(),o.cancelado?"cancelado":o.status,o.guia,o.sol.nombre,o.sol.empresa,dest(o.dest).name,o.totals.piezas,o.totals.m3.toFixed(4),o.totals.kg.toFixed(2),o.totals.kgVol.toFixed(2),o.totals.kgCob.toFixed(2),o.totals.subtotal.toFixed(2),o.totals.total.toFixed(2)]));
      download("pedidos-alr.csv","﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv"); }
  else if("resetOrders" in D){ if(ask("¿Restablecer pedidos de ejemplo? Da clic otra vez para confirmar")){ ORD=seedOrders(); saveOrd(); render(); toast("Pedidos restablecidos"); } }
  else if("resetAll" in D){ if(ask("Se borrará todo. Da clic otra vez para confirmar")){ CFG=DEFAULT_CFG(); saveCfg(); ORD=seedOrders(); saveOrd(); Q=newQ(); render(); toast("Valores de fábrica"); } }
  else if("addCaja" in D){ CFG.cajas.push({id:"c"+Date.now(),name:"Caja nueva",l:40,a:40,h:40,kg:10,prices:Object.fromEntries(CFG.destinos.map(d=>[d.id,0]))}); saveCfg(); Q=newQ(); render(); }
  else if(D.delCaja!==undefined){ CFG.cajas.splice(+D.delCaja,1); saveCfg(); Q=newQ(); render(); }
  else if("addDest" in D){ CFG.destinos.push({id:"d"+Date.now(),name:"Nuevo destino",transit:"",ocurre:false,kgRate:3}); saveCfg(); Q=newQ(); render(); }
  else if(D.delDest!==undefined){ CFG.destinos.splice(+D.delDest,1); saveCfg(); Q=newQ(); render(); }
  else if("logoReset" in D){ CFG.brand.logo=null; saveCfg(); render(); }
  else if(t.id==="q-add"){ Q.items.push({cajaId:CFG.cajas[0].id,qty:1}); renderPieces(); renderSummary(); }
  else if(t.id==="q-send"){ submitOrder(); }
  else if(D.p==="del"){ const i=+t.closest(".piece").dataset.i; if(Q.items.length>1){ Q.items.splice(i,1); renderPieces(); renderSummary(); } }
});

document.addEventListener("input", e=>{
  const t=e.target, D=t.dataset;
  if(t.id==="q-dest"){ Q.dest=t.value; renderPieces(); renderSummary(); renderOcurre(); return; }
  if(D.f){ setPath(Q,D.f,t.value); renderSummary(); return; }
  if(D.serv){ Q.serv[D.serv]=t.checked; return; }
  if(D.p){ const pc=t.closest(".piece"), it=Q.items[+pc.dataset.i];
    if(D.p==="tipo"){ if(t.value==="custom"){ Object.assign(it,{custom:true,cajaId:null,l:"",a:"",h:"",kg:""}); } else { it.custom=false; it.cajaId=t.value; delete it.l;delete it.a;delete it.h;delete it.kg; } renderPieces(); }
    else { if(D.p==="qty"){ t.value=t.value.replace(/\D/g,"").replace(/^0+/,""); it.qty=parseInt(t.value,10)||0; } else it[D.p]=Math.max(0,+t.value||0); pc.querySelector(".meta").innerHTML = metaHTML(it); }
    renderSummary(); return; }
  if(t.id==="f-q"){ S.filtro=t.value; rerenderKeep(); return; }
  if(D.cb){ CFG.brand[D.cb]=t.value; saveCfg(); applyBrand(); return; }
  if(D.cg){ const v=t.value; CFG[D.cg]=["minimo","iva","volFactor"].includes(D.cg)?(+v||0):v; saveCfg(); return; }
  if(D.cc){ const i=+t.closest("tr").dataset.caja; CFG.cajas[i][D.cc]=["name"].includes(D.cc)?t.value:(+t.value||0); saveCfg(); Q=newQ(); return; }
  if(D.cp){ const i=+t.closest("tr").dataset.caja; CFG.cajas[i].prices[D.cp]=+t.value||0; saveCfg(); return; }
  if(D.cd){ const i=+t.closest("tr").dataset.dest; CFG.destinos[i][D.cd]=D.cd==="ocurre"?t.checked:D.cd==="kgRate"?(+t.value||0):t.value; saveCfg(); Q=newQ(); return; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.p==="qty"){ const it=Q.items[+t.closest(".piece").dataset.i]; if(!(it.qty>=1)){ it.qty=1; t.value="1"; t.closest(".piece").querySelector(".meta").innerHTML=metaHTML(it); renderSummary(); } return; }
  if(t.id==="f-est"){ S.fEstado=t.value; render(); }
  else if(t.id==="f-dst"){ S.fDest=t.value; render(); }
  else if(t.id==="d-jump"){ /* se aplica con "Guardar" */ }
  else if(t.id==="logo-file"){ const f=t.files[0]; if(!f) return; if(f.size>1.5e6){ toast("Imagen muy pesada (máx. 1.5 MB)"); return; }
    const r=new FileReader(); r.onload=()=>{ CFG.brand.logo=r.result; saveCfg(); render(); toast("Logo actualizado"); }; r.readAsDataURL(f); }
  else if(t.id==="cfg-file"){ const f=t.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const c=JSON.parse(r.result); if(!c.cajas||!c.destinos||!c.brand) throw 0; CFG=c; saveCfg(); Q=newQ(); render(); toast("Configuración importada"); }catch(_){ toast("Archivo de configuración inválido"); } }; r.readAsText(f); }
  else if(t.dataset.cd==="ocurre"||t.dataset.cc||t.dataset.cp){ /* ya guardado en input */ }
});
document.addEventListener("submit", e=>{
  if(e.target.id==="t-form"){ e.preventDefault(); S.track=$("#t-in").value; render(); }
  if(e.target.id==="pin-form"){ e.preventDefault(); if($("#pin").value===CFG.pin){ S.auth=true; render(); } else { toast("PIN incorrecto"); $("#pin").value=""; } }
});
window.addEventListener("storage", e=>{ if(e.key===KEY_ORD){ ORD=store.get(KEY_ORD)||ORD; if(!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); }
  if(e.key===KEY_CFG){ CFG=store.get(KEY_CFG)||CFG; } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.open){ S.open=null; render(); } });

render();
</script>
</body>
</html>
